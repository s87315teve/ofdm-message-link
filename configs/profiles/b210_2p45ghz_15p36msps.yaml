# One-way profile for tx_app / rx_app on USRPs at 15.36 MS/s, 2.45 GHz.
#   rx_app --transport uhd --overlay configs/profiles/b210_2p45ghz_15p36msps.yaml
#   tx_app --transport uhd --overlay configs/profiles/b210_2p45ghz_15p36msps.yaml --enable-rf ...
#
# 15.36 MS/s comes from a 30.72 MHz master clock, decimation 2
# (ofdm_link.radio.uhd.MASTER_CLOCK_RATES).  Tested on a B210 and an NI
# USRP-2901 only; the code does not restrict it by device.  Signal
# 2442.32-2457.68 MHz.  The aggregate airtime cap is 5 ms (80 000 samples at
# 50 ppm is 5.21 ms at this rate).  Measured one-way on 2026-11-11 between a
# B210 and an NI USRP-2901 on one bench: MCS 17 carried about 35.5 Mb/s,
# limited by TX airtime (docs/07-reference.md 7.4).  It does not arm the
# transmitter: every RF run still requires --enable-rf and its acknowledgement.
phy:
  sample_rate: 15360000
  center_frequency: 2450000000
  mcs: qpsk
  fec:
    scheme: turbo
    code_rate: "1/3"
    decision_mode: turbo
    max_iterations: 8
  sync:
    detection_threshold: 0.25
    correlation_threshold: 0.30

mac:
  aggregation:
    max_burst_airtime_ms: 5.0

radio:
  adapter: uhd
  rf_enabled: false
  bandwidth: 15360000
  rx_gain: 30.0
  tx_gain: 0.0
  rx_antenna: TX/RX
  tx_antenna: TX/RX
  clock_source: internal
