# Bidirectional FDD link for node_app on two USRP B210s at 15.36 MS/s.
#   node_app --transport uhd --overlay configs/profiles/duplex_fdd_2420_2460_15p36.yaml ...
#
# 15.36 MS/s is the LTE rate a B210 reaches from a 30.72 MHz master clock with a
# clean decimation by 2 (ofdm_link.radio.uhd.MASTER_CLOCK_RATES sets that clock;
# it is also the highest a B210 allows with both channels in use).  B210 only:
# a Pluto stays at 5 MS/s.  The node's TX analog filter defaults to 40 MHz at
# this rate, so the signal shifted 8 MHz by the LO offset stays inside it.
#
# Same frequencies as duplex_fdd_2420_2460.yaml: node 1 TX 2420 / RX 2460 MHz,
# node 2 the reverse.  Signal edges 2412.32-2427.68 and 2452.32-2467.68 MHz,
# inside 2400-2483.5 MHz, 40 MHz apart.
#
# The aggregate airtime cap is 5 ms: the receiver's timing correction covers
# 80 000 samples at 50 ppm, 5.21 ms at 15.36 MS/s (configuration validation
# refuses the 8 ms default here).  Not measured on hardware yet.
#
# Like every profile, this does not arm a transmitter: each RF run still
# needs --enable-rf and its explicit acknowledgement.
phy:
  sample_rate: 15360000
  center_frequency: 2440000000
  mcs: qpsk
  fec:
    scheme: turbo
    code_rate: "1/3"
    decision_mode: turbo
    max_iterations: 8
  sync:
    detection_threshold: 0.25
    correlation_threshold: 0.30

mac:
  duplex: fdd
  aggregation:
    max_burst_airtime_ms: 5.0

radio:
  adapter: uhd
  rf_enabled: false
  bandwidth: 15360000
  rx_gain: 30.0
  tx_gain: 0.0
  rx_antenna: TX/RX
  tx_antenna: TX/RX
  clock_source: internal

duplex:
  mode: fdd
  control_mcs_index: 8
  nodes:
    - {node_id: 1, tx_frequency: 2420000000, rx_frequency: 2460000000}
    - {node_id: 2, tx_frequency: 2460000000, rx_frequency: 2420000000}
