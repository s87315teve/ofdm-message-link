# Optional profile: 3.8 GHz, 5 MS/s, for a B210 / NI USRP-2901 pair.  Not the
# default; pass it to BOTH apps with --overlay configs/profiles/b210_ota_3p8ghz.yaml.
#
# The gains below are high.  Use this profile only where you are allowed to
# transmit in this band, or over a cable with an attenuator.  It does not arm
# the transmitter: every RF run still requires --enable-rf and its explicit
# acknowledgement.
phy:
  sample_rate: 5000000
  center_frequency: 3800000000
  mcs: qpsk
  fec:
    scheme: turbo
    code_rate: "1/3"
    decision_mode: turbo
    max_iterations: 8
  sync:
    # Legacy (v1-v4, receive-only) preamble thresholds; the v5 ones are
    # phy.rx in default.yaml.
    # The same values as the default 2.45 GHz profile.  They were measured on
    # Plutos (experiments/rx_improvement); this radio pair has not been measured
    # with the improved receiver.  The correlation threshold is what keeps noise
    # out, and signal-free air on USRPs peaked at 0.199, so 0.30 keeps a margin.
    detection_threshold: 0.25
    correlation_threshold: 0.30

radio:
  adapter: uhd
  rf_enabled: false
  bandwidth: 5000000
  rx_gain: 40.0
  tx_gain: 85.0
  rx_antenna: TX/RX
  tx_antenna: TX/RX
  clock_source: internal
