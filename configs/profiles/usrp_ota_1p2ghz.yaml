# Optional profile: 1.2 GHz, 5 MS/s.  Not the default; pass it to BOTH apps with
# --overlay configs/profiles/usrp_ota_1p2ghz.yaml.
#
# It exists for an N210 with a CBX daughterboard (1.2-6 GHz) paired with
# antennas cut for about 900 MHz: 1.2 GHz is the supported frequency closest to
# their band.  915 MHz is not reachable with a CBX; UHD clamps the request to
# 1180 MHz.
#
# 1164-1300 MHz is allocated to satellite navigation (GNSS).  Use this profile
# only where you are allowed to, at low power and short range, or over a cable.
# It does not arm the transmitter: every RF run still requires --enable-rf and
# its explicit acknowledgement.
phy:
  sample_rate: 5000000
  center_frequency: 1200000000
  mcs: qpsk
  fec:
    scheme: turbo
    code_rate: "1/3"
    decision_mode: turbo
    max_iterations: 8
  sync:
    # Legacy (v1-v4, receive-only) preamble thresholds; the v5 ones are
    # phy.rx in default.yaml.
    # The same values as the default 2.45 GHz profile.  They were measured on
    # Plutos (experiments/rx_improvement); this radio pair has not been measured
    # with the improved receiver.  The correlation threshold is what keeps noise
    # out, and signal-free air on USRPs peaked at 0.199, so 0.30 keeps a margin.
    detection_threshold: 0.25
    correlation_threshold: 0.30

radio:
  adapter: uhd
  rf_enabled: false
  bandwidth: 5000000
  rx_gain: 15.0
  tx_gain: 5.0
  rx_antenna: TX/RX
  tx_antenna: TX/RX
  clock_source: internal
