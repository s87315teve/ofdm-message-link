# 10 MS/s variant of b210_ota_3p8ghz.yaml.
#
# Identical to the 5 MS/s profile except the sample rate and the analog
# bandwidth, which both double.  Synchronization thresholds are deliberately
# unchanged.  Twice the bandwidth admits twice the noise: at the same gains it
# measured 2.5-5 dB less effective SNR than the 5 MS/s profile.
# It does not arm the transmitter: every RF run still requires --enable-rf and
# its explicit acknowledgement.
phy:
  sample_rate: 10000000
  center_frequency: 3800000000
  mcs: qpsk
  fec:
    scheme: turbo
    code_rate: "1/3"
    decision_mode: turbo
    max_iterations: 8
  sync:
    # The same values as the default 2.45 GHz profile.  They were measured on
    # Plutos (experiments/rx_improvement); this radio pair has not been measured
    # with the improved receiver.  The correlation threshold is what keeps noise
    # out, and signal-free air on USRPs peaked at 0.199, so 0.30 keeps a margin.
    detection_threshold: 0.25
    correlation_threshold: 0.30

radio:
  adapter: uhd
  rf_enabled: false
  bandwidth: 10000000
  rx_gain: 40.0
  tx_gain: 85.0
  rx_antenna: TX/RX
  tx_antenna: TX/RX
  clock_source: internal
