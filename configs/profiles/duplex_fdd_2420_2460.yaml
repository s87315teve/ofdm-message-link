# Bidirectional FDD link for node_app: two ADALM-Plutos, 5 MS/s, 2.4 GHz ISM.
# Overlay after default.yaml (node_app's default overlay), e.g.
#   --overlay configs/profiles/duplex_fdd_2420_2460.yaml
#
# Node 1 ("A") transmits on 2420 MHz and receives on 2460 MHz; node 2 ("B")
# the reverse.  The 40 MHz spacing and the 5 MS/s signal keep both signals
# inside 2400-2483.5 MHz.  2420 MHz lies in Wi-Fi channel 1 (2401-2423) and
# 2460 MHz in channel 11 (2451-2473): Wi-Fi bursts show as channel loss.
# The self-interference measurement behind this choice is in
# experiments/duplex_fdd/results/si/README.md.
#
# Like every profile, this does not arm a transmitter: each RF run still
# needs --enable-rf and its explicit acknowledgement.  Keep the TX gain at or
# below 0 dB (a Pluto's attenuator setting), and check which bands and power
# levels your lab may use.
phy:
  sample_rate: 5000000
  center_frequency: 2440000000
  mcs: qpsk
  fec:
    scheme: turbo
    code_rate: "1/3"
    decision_mode: turbo
    max_iterations: 8
  sync:
    detection_threshold: 0.25
    correlation_threshold: 0.30

mac:
  duplex: fdd

radio:
  adapter: uhd
  rf_enabled: false
  bandwidth: 5000000
  rx_gain: 15.0
  tx_gain: 0.0
  rx_antenna: TX/RX
  tx_antenna: TX/RX
  clock_source: internal

duplex:
  mode: fdd
  control_mcs_index: 8
  nodes:
    - {node_id: 1, tx_frequency: 2420000000, rx_frequency: 2460000000}
    - {node_id: 2, tx_frequency: 2460000000, rx_frequency: 2420000000}
