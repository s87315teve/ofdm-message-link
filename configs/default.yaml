# Base configuration.  A profile under configs/profiles/ is layered on top of it
# (--overlay); by default that is ota_2p45ghz.yaml.
#
# What the one-way message link reads: phy, radio and acceleration.  The
# simulation section feeds the channel model the PHY tests use.  The node,
# network and mac sections are required by the configuration schema
# (src/ofdm_link/config.py) but a one-way link has no IP interface, no TDD and
# no ARQ, so their values are not used.
schema_version: 1

node:
  role: coordinator
  node_id: 1

network:
  interface_name: ofdm0
  address: 10.77.0.1/30
  mtu: 1280

phy:
  sample_rate: 10000000
  fft_len: 64
  cyclic_prefix_len: 16
  mcs: qpsk
  center_frequency: 2450000000
  fec:
    scheme: turbo
    code_rate: "1/3"
    decision_mode: turbo
    max_iterations: 8
  # Wire-v5 transmit settings.  All three are experiment toggles kept
  # settable until the hardware sweeps have confirmed the defaults.
  v5:
    # Zeros pushed before and after each v5 burst (0-256).  The STF absorbs
    # the radio's switch-on transient; the trailing zeros flush the TX
    # filters.  Legacy bursts keep their 256 + 256.
    guard_pre_samples: 16
    guard_post_samples: 64
    # false sends scrambler seed 0 (identity).  Experiment only: the payload
    # bits then shape the constellation statistics, PAPR and TX power.
    scrambler: true
  # Receiver settings.  The receiver decodes v1-v4 and v5 bursts in one
  # stream; every key here except the last two is an experiment toggle or a
  # threshold to be set from signal-free air captures.
  rx:
    # Switch either acquisition family off (CPU, cross-family A/B).
    legacy_acquisition: true
    v5_acquisition: true
    # v5 detector: M128 gate, coherent STF check, LTF-pair correlation and the
    # L1/L2 balance test that keeps legacy bursts from being acquired as v5.
    # Signal-free air on two Plutos (experiments/tx_v5, noise scan) reached
    # 0.084 STF and 0.067 pair confidence, with no false acquisition in 90 s.
    v5_detection_threshold: 0.10
    v5_stf_threshold: 0.20
    v5_correlation_threshold: 0.25
    v5_balance_ratio: 0.5
    # Low-pass the acquisition copy of the samples to the occupied band
    # (both families).  Experiment only.
    acquisition_prefilter: false
    # v5 channel estimate from both LTF symbols (false: L1 only), and the
    # delay-limited smoothing of it (false: raw LS).  Experiment only.
    ltf_average: true
    channel_smoothing: true
    # Noise variance behind the v5 payload LLRs: max of the SIG-measured and
    # LTF-measured values, or one of them.  Experiment only.
    llr_noise_source: max
    # Largest PSDU a v5 SIG may signal, and the Turbo iteration cap.
    max_psdu_bytes: 16384
    turbo_max_iterations: 8
    # Samples every v5 FFT window (LTF, SIG, payload) starts inside its
    # cyclic prefix: tolerance for late timing and clock drift (0-8).
    fft_backoff_samples: 3

mac:
  duplex: tdd
  arq_window: 32
  max_retries: 8
  max_fragment_payload: 1024
  max_pending_sdus: 64
  retransmission_timeout_s: 0.100
  tdd:
    link_id: 1
    beacon_duration_s: 0.001
    downlink_duration_s: 0.015
    guard_duration_s: 0.001
    uplink_duration_s: 0.015
    beacon_timeout_s: 0.132
  # How a v5 transmitter packs queued datagrams into one burst: whatever is
  # queued when the radio can take the next burst, up to these caps.  The
  # airtime cap bounds clock drift, peak-normalization loss and decode
  # latency per burst.  enabled: false (one datagram per burst) and the wait
  # are experiment toggles.
  aggregation:
    enabled: true
    max_wait_ms: 0.0
    max_subframes: 16
    max_psdu_bytes: 8192
    # At most 80 000 samples (8 ms at 10 MS/s, 16 ms at 5): the longest burst
    # whose drift at 50 ppm the receiver's timing correction covers.
    max_burst_airtime_ms: 8.0
    # Burst-rate cap: hold a burst until this long after the previous one
    # went to the radio and fill it meanwhile (0 disables).  Short datagrams
    # otherwise go out one per burst at 230-300 bursts/s, which overflows the
    # receiver's per-burst cost and nears the Pluto's push limit (0.413 ms +
    # 0.194 us/sample).  Measured on two PlutoSDRs, 300 B at MCS 14: 0.53 Mb/s
    # uncapped, 5.92 Mb/s with ~14 subframes per burst.  Costs up to this much
    # latency, and only when bursts are back to back.  4 ms = at most 250/s.
    min_burst_interval_ms: 4.0

radio:
  adapter: simulation
  rf_enabled: false
  device_args: ""
  rx_gain: 20.0
  tx_gain: 0.0
  bandwidth: 10000000
  rx_antenna: RX2
  tx_antenna: TX/RX
  clock_source: internal

simulation:
  profile: nominal
  snr_db: 15.0
  cfo_subcarrier_fraction: 0.2
  sample_rate_offset_ppm: 20.0
  amplitude_min: 0.5
  amplitude_max: 2.0
  taps:
    - [1.0, 0.0]
    - [0.18, 0.08]
    - [0.06, -0.04]

gui:
  enabled: false

acceleration:
  backend: native
  device: cpu
  # Worker processes for the per-burst receive path. 1 keeps everything inline
  # with no process and no IPC, N > 1 fixes the count, and 0 asks which CPUs
  # this process may actually run on. The output never depends on this value.
  decode_workers: 1
  # How many CPU cores one endpoint may occupy. N > 0 is taken literally and 0
  # asks which CPUs this process may actually run on. It caps every numeric
  # library's thread pool: NumPy's BLAS otherwise sizes its pool from the
  # machine and spins those threads between calls, which cost 15.6 of 20 cores
  # and a third of the link's throughput on a 20-core host. The budget is a
  # cap on waste, not a throughput dial -- one endpoint process is limited by
  # one interpreter lock to roughly 1.2 cores until per-burst decode moves into
  # worker processes. The output never depends on this value.
  cpu_cores: 4
